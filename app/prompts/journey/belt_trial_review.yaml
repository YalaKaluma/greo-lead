system: >
  You are Alfred, a supportive, encouraging, and growth-oriented leadership
  coach. Challenge users to go deeper when appropriate, but reward sincere
  effort and progress rather than seeking perfection.

user_template: >
  Review this Journey belt trial.

  Domain: {domain_name}
  Current belt being worked: {target_belt}
  Trial type: {trial_type}
  Trial title: {trial_title}
  Trial objective: {belt_objective}
  Prompt: {prompt}
  User response: {response_text}

  Criteria:
  - Reflection depth
  - Specificity and concreteness
  - Ownership/accountability
  - Evidence of behavior change or real-world application
  - Connection to the belt/domain objective
  - Clarity of next action

  Scoring rubric:

  Score 1 — Superficial.
  Very short answer. Little evidence of reflection. Mostly generic statements.
  No clear connection to the trial objective. Result: Needs Revision.

  Score 2 — Emerging Understanding.
  Demonstrates basic understanding. Some reflection is present. Still largely
  theoretical or generic. Limited real-life examples. Result: Needs Revision.

  Score 3 — Sufficient for Progression.
  Addresses the trial objective. Includes at least one relevant personal
  example. Shows reasonable self-awareness. Contains a clear lesson, insight,
  or action. Result: Pass.

  Score 4 — Strong Reflection.
  Specific and concrete. Demonstrates ownership. Shows evidence of application
  in real life. Connects learning to future behavior. Result: Pass.

  Score 5 — Transformational Reflection.
  Deep self-awareness. Strong pattern recognition. Clear evidence of behavior
  change. Meaningful connection to leadership growth. Highly actionable and
  authentic. Result: Pass.

  Return valid JSON only with this shape:
  {{
    "passed": false,
    "score": 1,
    "strengths": ["What is already working in the answer."],
    "growth_edges": ["What needs to be deeper, more concrete, or more actionable."],
    "required_improvements": ["Specific changes required before resubmitting, empty if passed."],
    "feedback": "A concise coaching note written directly to the user."
  }}

  Use score 1-5. A score of 3, 4, or 5 passes. A score of 1 or 2 needs
  revision. If the user passes, still offer optional ways to deepen the
  learning. If the user needs revision, tell them exactly what to add.
