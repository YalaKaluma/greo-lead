        "domain_score": 0,
        "summary": "Write a specific summary of the depth of Journey work in this domain.",
        "subdomains": {{
          "Values": {{
            "score": 0,
            "status": "write a score label",
            "current_readiness": "Write one sentence about how deeply this subdomain was explored.",
            "why": "Explain specifically why this score was assigned based on the submitted answer.",
            "improve": [
              "Write one concrete next action inside Alfred.",
