  The wheel_scores object must include all five domains and all fifteen subdomains.
  Every subdomain must have unique, non-repetitive why and improve fields.
  Do not frame low scores as weak leadership capability. Frame them as places where
  the Journey work needs deeper, more honest, more specific, or more actionable reflection.

  Current belt curriculum evidence:
  {evidence_json}
