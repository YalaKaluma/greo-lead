# journey_trials.yaml
#
# Journey 2.0 curriculum configuration.
# Updated to add leadership stories and explicit display_order metadata.
# Vision and People trial wording/order reflects Alfred_Belt_Trials_v3_ManualTitles.xlsx.
# Leadership story content is curriculum content and should not be regenerated by implementation code.

version: 1
belts:
  white:
    name: White Belt
    meaning: Awareness
    description: Recognize the dimension and begin naming current patterns.
  yellow:
    name: Yellow Belt
    meaning: Understanding
    description: Understand motivations, contradictions, and recurring patterns.
  green:
    name: Green Belt
    meaning: Application
    description: Practice the behavior deliberately in real life.
  brown:
    name: Brown Belt
    meaning: Integration
    description: Sustain the behavior under pressure and across contexts.
  black:
    name: Black Belt
    meaning: Transmission
    description: Help others develop the same capacity.
dimensions:
  vision:
    name: Vision
    description: Purpose, values, strengths, and long-term direction.
    belts:
      white:
        criteria: Understand the relationship between values (purpose), strengths (fulfillment), and vision (direction). Begin
          discovering what genuinely matters to you.
        reflection:
          title: Meaningful Achievement
          prompt: Describe one of your greatest achievements. Why was it truly meaningful to you?
          grading_focus:
          - meaning
          - achievement reflection
          - values awareness
          - fulfillment clarity
          completion_hint: Connect achievement to values, strengths, and genuine meaning.
          display_order: 1
        real_world:
          active: true
          title: Vision Alignment
          prompt: Share your vision and goals with someone you trust and discuss whether it feels authentic and aligned with
            who you truly are.
          completion_hint: Test your vision in conversation with someone who can reflect honestly.
          display_order: 3
        behavioral:
          title: Foundation Complete
          prompt: Complete vision, values, and strengths in Alfred's evidence library.
          signals:
          - vision_completed
          - values_completed
          - strengths_completed
          completion_hint: Alfred looks for the core direction map to be fully captured.
          display_order: 2
        story:
          title: The Stonecutter
          theme: Meaning
          image_src: /vision-stonecutter.png
          image_alt: Stonecutter working in front of a cathedral under construction.
          tagline: I am not cutting stones. I am building a cathedral.
          full_story: |-
            Three stonecutters are asked what they are doing.

            The first says, "I am cutting stones."

            The second says, "I am earning a living."

            The third says, "I am building a cathedral."

            All three are doing the same work. Only one understands the deeper meaning behind it.

            Leadership begins when people learn to see the cathedral behind the stones: the larger purpose that gives effort, achievement, and sacrifice their meaning.
          lessons:
          - Meaning comes from purpose.
          - Achievement is most fulfilling when connected to something larger than yourself.
          - Before leading others, discover your cathedral.
          discussion_question: What cathedral are you trying to build?
      yellow:
        criteria: Apply self-awareness intentionally and begin aligning behavior and priorities with deeper motivations, vision,
          and purpose.
        reflection:
          title: False Motivation
          prompt: Describe a vision, goal, or direction you pursued that was not fully aligned with your values. What was
            driving you at the time, and what did you learn from the experience?
          grading_focus:
          - motivation honesty
          - self-awareness
          - misalignment recognition
          - ownership
          completion_hint: Identify the deeper driver beneath a direction that was not fully aligned.
          display_order: 2
        real_world:
          title: Values Discussion
          prompt: Share your values with someone you trust and discuss how they connect with your vision.
          completion_hint: Practice translating values into the direction you actually pursue.
          display_order: 1
        behavioral:
          title: Energy Journal
          prompt: Journal on 7 different occasions how values, strengths, and vision affect energy and fulfillment on a given
            day.
          signals:
          - vision_completed
          - values_strengths_energy_journals
          - fulfillment_reflections
          completion_hint: Alfred looks for repeated reflection on how values and strengths shape fulfillment.
          display_order: 3
        story:
          title: The Mexican Fisherman
          theme: Authenticity
          full_story: |-
            An investment banker is vacationing in a small coastal village.

            He sees a fisherman return with a few beautiful fish and asks, "Why don't you stay out longer and catch more fish?"

            The fisherman replies, "I have enough."

            The banker explains that if the fisherman worked longer, he could catch more fish, buy more boats, build a fleet, grow a company, sell it, and become rich.

            The fisherman asks, "And then what?"

            The banker answers, "Then you could retire to a small coastal village, spend time with your family, fish a little, play music with your friends, and enjoy life."

            The fisherman smiles and says, "That is what I am already doing."
          lessons:
          - Success is not the same as fulfillment.
          - Many people pursue goals that are not truly theirs.
          - Values and vision should create energy rather than drain it.
          discussion_question: Where might you be pursuing someone else's definition of success?
      green:
        criteria: Integrate values, strengths, vision, and energy into a coherent operating system that remains stable under
          pressure.
        reflection:
          title: Life Alignment
          prompt: Looking back at your energy journals, what patterns have you discovered about the relationship between your
            strengths, values, vision, and daily energy?
          grading_focus:
          - integration
          - systems thinking
          - pressure stability
          - self-knowledge
          completion_hint: Show how your direction, energy, strengths, and values now work together.
          display_order: 1
        real_world:
          title: Alignment Audit
          prompt: Audit one major area of your life (career, health, relationships, time allocation) for alignment and make
            one meaningful change.
          completion_hint: Use the audit to make a concrete adjustment toward alignment.
          display_order: 3
        behavioral:
          title: Vision Integration
          prompt: Explicitly link your vision to values and strengths.
          signals:
          - vision_linked_to_values
          completion_hint: Alfred checks that each completed vision has at least one associated value.
          display_order: 2
        story:
          title: The Big Rocks
          theme: Alignment
          full_story: |-
            A professor stands in front of a class with a large glass jar.

            He places several large rocks into the jar and asks, "Is it full?"

            The class says yes.

            He then pours in gravel. The gravel fills the spaces between the rocks.

            "Now is it full?"

            Again, the class says yes.

            He pours in sand. The sand fills the remaining gaps. Then he adds water.

            Finally, he explains the lesson: "If you don't put the big rocks in first, you will never fit them in at all."

            The big rocks are the things that matter most: your values, strengths, energy, relationships, and vision. If they are not placed first, life fills with everything else.
          lessons:
          - A meaningful life requires deliberate alignment.
          - Your calendar, energy, relationships, and choices reveal what your real priorities are.
          - If you do not protect the big rocks, smaller demands will fill the jar.
          discussion_question: What are the big rocks that must come first in your life now?
      brown:
        criteria: Develop the wisdom and clarity necessary to help others find alignment, purpose, and intentional direction
          in their own lives.
        reflection:
          title: Wisdom
          prompt: When helping others clarify their vision, what lessons from your own journey did you find yourself sharing
            most often?
          grading_focus:
          - wisdom
          - earned clarity
          - transmission
          - humility
          completion_hint: Distill the principles you can now pass on to others.
          display_order: 3
        real_world:
          title: Guide Another
          prompt: Help someone around you define their strengths, values, and meaningful vision. Support them in finding greater
            alignment.
          completion_hint: Guide someone else toward their own alignment without imposing yours.
          display_order: 2
        behavioral:
          title: Support Network
          prompt: Capture how your vision is supported by people, their strengths, and their values.
          signals:
          - vision_linked_to_people
          - people_strengths_flagged
          - people_values_flagged
          completion_hint: Alfred looks for direction becoming relational and useful to others.
          display_order: 1
        story:
          title: The Old Man and the Trees
          theme: Stewardship
          full_story: |-
            An old man is planting trees.

            A traveler stops and asks, "Why are you planting these? You will never live long enough to sit in their shade."

            The old man smiles and replies, "I sit under trees I did not plant."

            The traveler realizes that the old man is not planting for himself alone. He is honoring what he received and preparing something for those who will come after him.

            Mature leadership is the same. The wisdom you earn through your own journey becomes most valuable when it helps others find their own alignment.
          lessons:
          - Nobody builds a meaningful vision alone.
          - Wisdom becomes leadership when it helps others grow.
          - Great leaders plant trees whose shade they may never enjoy.
          discussion_question: What wisdom from your journey is now ready to serve someone else?
      black:
        criteria: Develop the wisdom and clarity necessary to help others find alignment, purpose, and intentional direction
          in their own lives.
        reflection:
          title: Reflection Trial
          prompt: What wisdom now guides your decisions, and how was it earned?
          grading_focus:
          - wisdom
          - earned clarity
          - transmission
          - humility
          completion_hint: Distill the principles you can now pass on to others.
          display_order: 1
        real_world:
          title: Real-World Trial
          prompt: Help someone around you define their strengths, values, and meaningful vision. Support them in finding greater
            alignment.
          completion_hint: Guide someone else toward their own alignment without imposing yours.
          display_order: 2
        behavioral:
          title: Behavioral Evidence
          prompt: Capture how your vision is supported by people, strengths, and values.
          signals:
          - vision_linked_to_people
          - people_strengths_flagged
          - people_values_flagged
          completion_hint: Alfred looks for direction becoming relational and useful to others.
          display_order: 3
        story:
          title: ''
          theme: ''
          full_story: ''
          lessons: &id001 []
          discussion_question: ''
  people:
    name: People
    description: Communication, delegation, inspiration, and trust.
    belts:
      white:
        criteria: Recognizes impact on others.
        reflection:
          title: Leadership Style
          prompt: How would you describe your leadership style?
          grading_focus:
          - impact awareness
          - honesty
          - emotional specificity
          - ownership
          completion_hint: Notice how your behavior landed on another person.
          display_order: 3
        real_world:
          active: true
          title: Leadership Feedback
          prompt: Ask one person for feedback on how they experience your leadership and share what you learned.
          completion_hint: Invite reality from outside your own interpretation.
          display_order: 1
        behavioral:
          title: Team Foundations
          prompt: Complete team composition, inspire, and delegate section in Alfred's evidence library.
          signals:
          - relationship_reflections
          - people_reviews
          - journal_entries
          completion_hint: Alfred looks for early relationship awareness.
          display_order: 2
        story:
          title: The Young Samurai and the Mirror
          theme: Self-Awareness
          image_src: /people-mirror.png
          image_alt: A teacher holding a mirror to help a young leader see himself clearly.
          tagline: Before you can lead others, you must first learn to see yourself clearly.
          full_story: |-
            A young samurai asks his master:

            "How do I become a great leader?"

            The master hands him a mirror.

            The student looks confused.

            "I asked how to lead others," he says.

            The master replies:

            "Before you can lead others, you must first learn to see yourself clearly. Leadership always begins with self-awareness."

            The student realizes that before he can guide others, he must first understand the person looking back at him in the mirror.
          lessons:
          - Leadership begins with self-awareness.
          - Before you can guide others, you must understand yourself clearly.
          - Strengths, weaknesses, fears, habits, and reactions all shape how you lead.
          discussion_question: What do you need to see more clearly about yourself before leading others?
      yellow:
        criteria: Understand how your behavior, emotions, communication style, and leadership presence impact other people.
          Begin developing awareness of trust, empathy, and relational patterns.
        reflection:
          title: Leadership Ripples
          prompt: Reflect on your leadership style using a real example. Describe a situation where your behavior positively
            or negatively impacted another person or team.
          grading_focus:
          - impact awareness
          - leadership presence
          - emotional honesty
          - ownership
          completion_hint: Use a concrete example to understand how your style lands on others.
          display_order: 3
        real_world:
          title: Communication Feedback
          prompt: Ask someone you trust for honest feedback about how you show up under stress. Reflect on what surprised
            you most.
          completion_hint: Invite honest feedback and look for what you did not already know.
          display_order: 2
        behavioral:
          title: Know Your Team
          prompt: Enter at least 5 team members (direct report, peers or supervisors) into Alfred and be specific about their
            strength, weakness and aspirations.
          signals:
          - five_team_members_entered
          completion_hint: Alfred looks for your leadership context to be mapped through real people.
          display_order: 1
        story:
          title: The Ripple Effect
          theme: Impact
          full_story: |-
            A teacher walks to a lake with a student.

            He throws a small stone into the water.

            The student watches the ripples spread across the entire lake.

            The teacher asks, "How large was the stone?"

            The student replies, "Very small."

            The teacher smiles and says, "And yet it touched the entire lake."

            Then he continues, "Leadership is the same. Most leaders think only about the stone. Great leaders learn to see the ripples."

            A careless comment can lower someone's confidence. A moment of trust can unlock potential. A leader's smallest behaviors can travel farther than they realize.
          lessons:
          - Every leadership action creates consequences.
          - Small behaviors often have outsized impact.
          - Leadership is measured by impact, not intention.
          discussion_question: What ripples are your leadership behaviors creating around you?
      green:
        criteria: Apply intentional leadership behaviors and begin aligning communication, delegation, empathy, and support
          with the kind of leader you want to become.
        reflection:
          title: Leadership Style
          prompt: Think of the most inspiring leader you have known. To what extent did they create dependence versus capability
            in others, and what does that teach you about your own leadership?
          grading_focus:
          - leadership aspiration
          - self-comparison
          - values clarity
          - behavioral intention
          completion_hint: Use admired leadership qualities to clarify your own growth edge.
          display_order: 3
        real_world:
          title: Delegation Practice
          prompt: Delegate a meaningful responsibility to someone and intentionally avoid stepping in unless truly necessary.
            Afterwards, openly discuss the experience with them.
          completion_hint: Practice trust, delegation, and follow-up conversation.
          display_order: 2
        behavioral:
          title: Team Reviews
          prompt: Complete at least 2 team reviews/check-ins in Alfred.
          signals:
          - two_team_reviews
          completion_hint: Alfred counts completed team reviews/check-ins in the background.
          display_order: 1
        story:
          title: The King's Successor
          theme: Empowerment
          full_story: |-
            A king spends decades building a prosperous kingdom.

            As he grows older, his advisors ask, "Who will replace you?"

            The king begins preparing a successor. He teaches, coaches, delegates, and gives the successor real responsibility.

            Over time, the successor becomes so capable that people begin seeking his advice instead of the king's.

            The advisors panic. "Your successor is becoming too powerful."

            The king smiles and says, "Then I have succeeded."

            Weak leaders need to remain indispensable. Strong leaders build people who can thrive without them.
          lessons:
          - Strong leaders build capability.
          - Weak leaders create dependence.
          - Leadership scales through trust, delegation, and empowerment.
          discussion_question: Are you building people who need you, or people who can grow beyond you?
      brown:
        criteria: Develop the ability to elevate, mentor, and multiply others through trust, empowerment, emotional wisdom,
          and authentic leadership.
        reflection:
          title: Leadership Legacy
          prompt: Looking back on your leadership journey, what have your greatest successes and failures taught you about
            developing people, and what kind of leader do you hope others become because of your influence?
          grading_focus:
          - transmission
          - legacy
          - humility
          - people development
          - emotional wisdom
          completion_hint: Clarify the human impact you want your leadership to leave behind.
          display_order: 1
        real_world:
          title: Develop Others
          prompt: Mentor, coach, or support someone through a meaningful personal or professional challenge while helping
            them build confidence, clarity, and ownership.
          completion_hint: Help another person grow without taking ownership away from them.
          display_order: 2
        behavioral:
          title: Leadership Multiplication
          prompt: Complete at least 2 team reviews and 2 journal reflections focused on how you are developing, empowering,
            and supporting the growth of others.
          signals:
          - two_development_empowerment_journals
          - two_team_reviews_growth_focus
          completion_hint: Alfred looks for evidence that your leadership consistently develops and empowers others.
          display_order: 3
        story:
          title: The Candle
          theme: Multiplication
          full_story: |-
            A student asks a master, "How do I know I have become a successful leader?"

            The master lights a candle.

            Then he uses it to light another candle. Then another. Then another.

            The room becomes brighter with every candle.

            The first candle has lost nothing.

            The master says, "A leader's success is not measured only by how brightly they shine. It is measured by how much light remains after they are gone."

            Leadership reaches its highest form when it creates more leaders.
          lessons:
          - Leadership reaches its highest form when it creates more leaders.
          - Influence is measured by what remains after you are gone.
          - Great leaders multiply people.
          discussion_question: Who is becoming stronger, clearer, or more confident because of your influence?
      black:
        criteria: Merged into Brown Belt capstone for People. Do not render as an active People belt unless Black Belt is
          reintroduced later.
        reflection:
          title: Reflection Trial
          prompt: Merged into Brown Belt Leadership Legacy.
          grading_focus:
          - transmission
          - legacy
          - emotional wisdom
          - service
          completion_hint: Clarify the human impact you want your leadership to leave behind.
          display_order: 3
          active: false
        real_world:
          title: Real-World Trial
          prompt: Merged into Brown Belt Develop Others.
          completion_hint: Help another person grow without taking ownership away from them.
          display_order: 2
          active: false
        behavioral:
          title: Behavioral Evidence
          prompt: Merged into Brown Belt Leadership Multiplication.
          signals:
          - two_delegate_empower_journals
          - two_team_reviews_needs_style
          completion_hint: Alfred looks for evidence that your leadership elevates others consistently.
          display_order: 1
          active: false
        story:
          title: ''
          theme: ''
          full_story: ''
          lessons: *id001
          discussion_question: ''
  execute:
    name: Prioritize & Execute
    description: Focus, discipline, prioritization, and delivery.
    belts:
      white:
        criteria: Understand how distraction, procrastination, emotional resistance, and lack of prioritization impact your
          execution and long-term goals. Begin developing awareness of your execution patterns.
        reflection:
          title: Reflection Trial
          prompt: Reflect on a situation where poor prioritization, procrastination, or lack of discipline negatively impacted
            your performance or well-being. What was truly driving the behavior?
          grading_focus:
          - execution awareness
          - procrastination insight
          - emotional resistance
          - ownership
          completion_hint: Identify what was driving the execution pattern beneath the surface behavior.
          display_order: 1
        real_world:
          active: true
          title: Task Logging Practice
          prompt: Start using Alfred's todolist feature consistently. Aim to log 10 Tasks in the next couple of weeks.
          completion_hint: Alfred looks for early task capture and consistent use of the todolist feature.
          display_order: 2
        behavioral:
          title: Behavioral Evidence
          prompt: Fill in your prioritization and procrastination tendency, and current executive system in Alfred's evidence library.
          signals:
          - prioritization_tendency_completed
          - procrastination_tendency_completed
          - executive_system_completed
          completion_hint: Alfred looks for your current execution pattern to be explicitly captured.
          display_order: 3
        story:
          title: The Aggregation of Marginal Gains
          theme: Discipline Compounds
          image_src: /execute-marginal-gains.png
          image_alt: British cycling scene illustrating one percent improvements and marginal gains.
          tagline: Small improvements, repeated consistently, create extraordinary results.
          full_story: |-
            In 2003, British Cycling was struggling.

            Despite a long history, British cyclists had achieved very little success on the world stage. For nearly a century, they had rarely won major international competitions and had never established themselves as a dominant force in the sport.

            When Dave Brailsford became performance director, he introduced a simple idea:

            Improve by 1%, consistently.

            Not 50%. Not 100%. Just 1%, every day.

            The team began searching for small improvements everywhere:

            Better bike seats
            Better tires
            Better riding positions
            Better nutrition
            Better sleep
            Better recovery
            Better training environments

            Individually, none of these changes seemed significant.

            Most people would have ignored them.

            But Brailsford understood something powerful:

            Small improvements become extraordinary when they are applied consistently and allowed to compound over time.

            The mathematics are remarkable. If you improve by just 1% every day, After one year you are nearly 38 times better than where you began.

            Most people dramatically overestimate what they can accomplish in a day and underestimate what they can accomplish in a year. Great leaders understand that success is rarely built through a single breakthrough.

          leadership_lesson: |-
            Leadership excellence is rarely the result of heroic effort.

            It is the result of small improvements applied consistently and allowed to compound over time.
          key_message: Small improvements compound into extraordinary outcomes.
          belt_purpose: Help users understand the power of discipline and consistent execution.
          lessons:
          - Leadership excellence is rarely the result of heroic effort.
          - Small improvements become extraordinary when they are applied consistently.
          - Success is built through small actions repeated over time.
          discussion_question: What 1% improvement could compound if you practiced it consistently?
      yellow:
        criteria: Apply intentional systems for prioritization, focus, planning, and execution. Begin aligning daily behavior
          with strategic priorities instead of reactive impulses.
        reflection:
          title: Reflection Trial
          prompt: Describe the moments or conditions under which your execution system tends to break down. What patterns,
            emotions, distractions, or behaviors usually cause you to lose focus, discipline, or momentum?
          grading_focus:
          - execution ownership
          - pattern recognition
          - responsibility
          - behavioral insight
          completion_hint: Identify the patterns that interfered with execution.
          display_order: 1
        real_world:
          title: Real-World Trial
          prompt: Plan your top priorities intentionally for one full week and complete them before engaging in lower-value
            or reactive work. Reflect on what changed.
          completion_hint: Practice acting from strategic priority before reactive demand.
          display_order: 2
        behavioral:
          title: Behavioral Evidence
          prompt: Start using Alfred's todolist feature consistently. Aim to log 20 Tasks in the next couple of weeks.
          signals:
          - tasks_consistently_entered
          - tasks_maintained
          completion_hint: Alfred looks for task capture and maintenance becoming consistent.
          display_order: 3
        story:
          title: Odysseus and the Sirens
          theme: Understanding Resistance
          full_story: |-
            In Greek mythology, Odysseus must sail past the Sirens.

            Their songs are so powerful that sailors lose control and steer their ships toward destruction.

            Odysseus understands that willpower alone may not be enough.

            Before entering dangerous waters:

            * He orders his crew to plug their ears.
            * He asks to be tied to the mast.
            * He instructs his crew to ignore his future requests for freedom.

            When the Sirens begin singing, Odysseus desperately tries to break free.

            But the system he designed protects him from himself.
          leadership_lesson: |-
            Personal execution failures are often emotional failures.

            Fear, avoidance, perfectionism, distraction, uncertainty, and discomfort frequently pull us away from our intentions.

            Before we can improve execution, we must understand the forces that repeatedly undermine it.
          key_message: Understand your resistance before attempting to master it.
          belt_purpose: Help users identify the emotional patterns that lead to procrastination, distraction, avoidance, and
            execution failure.
          lessons:
          - Personal execution failures are often emotional failures.
          - Fear, avoidance, perfectionism, distraction, uncertainty, and discomfort frequently pull us away from our intentions.
          - Before we can improve execution, we must understand the forces that repeatedly undermine it.
          discussion_question: What force most often pulls you away from your intentions?
      green:
        criteria: Integrate discipline, prioritization, focus, and execution into a stable operating system that remains effective
          under pressure, uncertainty, and competing demands.
        reflection:
          title: Reflection Trial
          prompt: What have you learned about the relationship between discipline, emotion, focus, and performance?
          grading_focus:
          - integration
          - discipline
          - emotional awareness
          - performance insight
          completion_hint: Connect execution performance to discipline, emotion, and focus as one system.
          display_order: 1
        real_world:
          title: Real-World Trial
          prompt: Identify one recurring source of distraction or reactive behavior in your life and redesign your environment,
            routines, or systems to reduce its influence.
          completion_hint: Make one structural change that reduces recurring distraction.
          display_order: 2
        behavioral:
          title: Behavioral Evidence
          prompt: Update your executive system in light of what you learned. Set up at least 3 habits that your executive
            system will rely on
          signals:
          - executive_system_updated
          - execution_lessons_integrated
          completion_hint: Alfred counts MTN classification reviews in the background.
          display_order: 3
        story:
          title: Atomic Habits
          theme: Systems Beat Motivation
          full_story: |-
            Many people assume high performers have more motivation.

            The central lesson of Atomic Habits is that sustainable success comes from systems, not motivation.

            Two people may have the same goal.

            One relies on discipline and willpower.

            The other designs routines, triggers, environments, habits, and review mechanisms that make success easier.

            Over time, the second person consistently outperforms the first.

            Not because they are stronger.

            Because they require less motivation.
          leadership_lesson: |-
            Motivation fluctuates, Systems endure.

            You do not rise to the level of your goals. You fall to the level of your systems.

            The goal is not to become more disciplined every day.

            The goal is to build systems that make disciplined behavior easier and more automatic.
          key_message: Systems beat motivation.
          belt_purpose: Help users design personal operating systems using routines, habits, reviews, triggers, checklists,
            and environmental design.
          lessons:
          - You do not rise to the level of your goals. You fall to the level of your systems.
          - Motivation fluctuates, Systems endures
          - The goal is to build systems that make disciplined behavior easier and more automatic.
          discussion_question: What system would make your most important disciplined behavior easier?
      brown:
        criteria: Develop the ability to help others improve their execution, prioritization, discipline, and operational
          effectiveness through systems, coaching, and example.
        reflection:
          title: Reflection Trial
          prompt: What principles now guide the way you prioritize, execute, and manage your attention?
          grading_focus:
          - principles
          - attention management
          - prioritization wisdom
          - execution clarity
          completion_hint: Distill the principles that now guide your execution system.
          display_order: 1
        real_world:
          title: Real-World Trial
          prompt: Help another person improve their workflow, prioritization system, or execution habits. Support them in
            becoming more intentional and disciplined.
          completion_hint: Translate your execution maturity into help for someone else.
          display_order: 2
        behavioral:
          title: Behavioral Evidence
          prompt: Review the habits powering your executive system after using them for a couple of weeks. Update your habits based on what you learned. 
          signals:
          - executive_system_updated
          - execution_lessons_integrated
          completion_hint: Alfred looks for your execution system evolving from lived learning.
          display_order: 3
        story:
          title: Toyota Production System
          theme: Building an Operating Model
          full_story: |-
            In the 1950s Toyota was significantly smaller than its competitors.

            Toyota could not compete through scale alone.

            Instead, it focused on creating an operating model that enabled reliable execution.

            Toyota became known for four principles:

            1. Clarity

               * Everyone understands what success looks like.
               * Processes are clearly defined.

            2. Ownership

               * Every activity has a clear owner.
               * Accountability is explicit.

            3. Accountability

               * Performance is visible.
               * Results are measured.

            4. Governance

               * Teams operate through regular review rhythms.
               * Issues are surfaced early and escalated appropriately.

            Toyota's success was not built on heroic employees.

            It was built on an operating model that allowed ordinary people to consistently produce extraordinary results.
          leadership_lesson: |-
            As leaders grow, execution can no longer depend on personal effort alone.

            Execution must become embedded within teams through ownership, accountability, governance, and operating mechanisms.

            The leader shifts from being the executor to being the architect.
          key_message: Great leaders build operating models, not heroic teams.
          belt_purpose: Teach users how to scale execution through teams by creating clarity, ownership, accountability, governance,
            and decision-making structures.
          lessons:
          - As leaders grow, execution can no longer depend on personal effort alone.
          - Execution must become embedded within teams through ownership, accountability, governance, and operating mechanisms.
          - The leader shifts from being the executor to being the architect.
          discussion_question: Where does your execution still depend too much on personal effort instead of an operating
            model?
