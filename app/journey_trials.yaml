# journey_trials.yaml
#
# Journey 2.0 curriculum configuration.
# This file is the source of truth for belt criteria, reflection trials,
# real-world trials, and behavioral signals. The UI can render one belt path
# at a time, while the backend keeps the full curriculum available for tuning.

version: 1

belts:
  white:
    name: White Belt
    meaning: Awareness
    description: Recognize the dimension and begin naming current patterns.
  yellow:
    name: Yellow Belt
    meaning: Understanding
    description: Understand motivations, contradictions, and recurring patterns.
  green:
    name: Green Belt
    meaning: Application
    description: Practice the behavior deliberately in real life.
  brown:
    name: Brown Belt
    meaning: Integration
    description: Sustain the behavior under pressure and across contexts.
  black:
    name: Black Belt
    meaning: Transmission
    description: Help others develop the same capacity.

dimensions:
  vision:
    name: Vision
    description: Purpose, values, strengths, and long-term direction.
    belts:
      white:
        criteria: Understand the relationship between values (purpose), strengths (fulfillment), and vision (direction). Begin discovering what genuinely matters to you.
        reflection:
          title: Reflection Trial
          prompt: Describe one of your greatest achievements. Why was it truly meaningful to you?
          grading_focus: [meaning, achievement reflection, values awareness, fulfillment clarity]
          completion_hint: Connect achievement to values, strengths, and genuine meaning.
        real_world:
          active: false
          title: Real-World Trial
          prompt: Share your vision with someone you trust and discuss whether it feels authentic and aligned with who you truly are.
          completion_hint: Test your vision in conversation with someone who can reflect honestly.
        behavioral:
          title: Behavioral Evidence
          prompt: Complete vision, values, and strengths in Alfred.
          signals: [vision_completed, values_completed, strengths_completed]
          completion_hint: Alfred looks for the core direction map to be fully captured.
      yellow:
        criteria: Apply self-awareness intentionally and begin aligning behavior and priorities with deeper motivations, vision, and purpose.
        reflection:
          title: Reflection Trial
          prompt: Describe a vision or direction you pursued for the wrong reasons. What truly drove it?
          grading_focus: [motivation honesty, self-awareness, misalignment recognition, ownership]
          completion_hint: Identify the deeper driver beneath a direction that was not fully aligned.
        real_world:
          title: Real-World Trial
          prompt: Share your values with someone you trust and discuss how they connect with your vision.
          completion_hint: Practice translating values into the direction you actually pursue.
        behavioral:
          title: Behavioral Evidence
          prompt: Journal on 3 different occasions how values, strengths, and vision affect energy and fulfillment on a given day.
          signals: [vision_completed, values_strengths_energy_journals, fulfillment_reflections]
          completion_hint: Alfred looks for repeated reflection on how values and strengths shape fulfillment.
      green:
        criteria: Integrate values, strengths, vision, and energy into a coherent operating system that remains stable under pressure.
        reflection:
          title: Reflection Trial
          prompt: What have you learned about the interdependency between your strengths, values, energy, and vision?
          grading_focus: [integration, systems thinking, pressure stability, self-knowledge]
          completion_hint: Show how your direction, energy, strengths, and values now work together.
        real_world:
          title: Real-World Trial
          prompt: Audit one major area of your life (career, health, relationships, time allocation) for alignment and make one meaningful change.
          completion_hint: Use the audit to make a concrete adjustment toward alignment.
        behavioral:
          title: Behavioral Evidence
          prompt: Explicitly link your vision to values and strengths.
          signals: [vision_linked_to_values]
          completion_hint: Alfred checks that each completed vision has at least one associated value.
      brown:
        criteria: Develop the wisdom and clarity necessary to help others find alignment, purpose, and intentional direction in their own lives.
        reflection:
          title: Reflection Trial
          prompt: What wisdom now guides your decisions, and how was it earned?
          grading_focus: [wisdom, earned clarity, transmission, humility]
          completion_hint: Distill the principles you can now pass on to others.
        real_world:
          title: Real-World Trial
          prompt: Help someone around you define their strengths, values, and meaningful vision. Support them in finding greater alignment.
          completion_hint: Guide someone else toward their own alignment without imposing yours.
        behavioral:
          title: Behavioral Evidence
          prompt: Capture how your vision is supported by people, strengths, and values.
          signals: [vision_linked_to_people, people_strengths_flagged, people_values_flagged]
          completion_hint: Alfred looks for direction becoming relational and useful to others.
      black:
        criteria: Develop the wisdom and clarity necessary to help others find alignment, purpose, and intentional direction in their own lives.
        reflection:
          title: Reflection Trial
          prompt: What wisdom now guides your decisions, and how was it earned?
          grading_focus: [wisdom, earned clarity, transmission, humility]
          completion_hint: Distill the principles you can now pass on to others.
        real_world:
          title: Real-World Trial
          prompt: Help someone around you define their strengths, values, and meaningful vision. Support them in finding greater alignment.
          completion_hint: Guide someone else toward their own alignment without imposing yours.
        behavioral:
          title: Behavioral Evidence
          prompt: Capture how your vision is supported by people, strengths, and values.
          signals: [vision_linked_to_people, people_strengths_flagged, people_values_flagged]
          completion_hint: Alfred looks for direction becoming relational and useful to others.

  people:
    name: People
    description: Communication, delegation, inspiration, and trust.
    belts:
      white:
        criteria: Recognizes impact on others.
        reflection:
          title: Reflection Trial
          prompt: How would you describe your leadership style?.
          grading_focus: [impact awareness, honesty, emotional specificity, ownership]
          completion_hint: Notice how your behavior landed on another person.
        real_world:
          active: false
          title: Real-World Trial
          prompt: Ask one person for feedback on how they experience your leadership.
          completion_hint: Invite reality from outside your own interpretation.
        behavioral:
          title: Behavioral Evidence
          prompt: Complete team composition, inspire, and delegate section in Alfred.
          signals: [relationship_reflections, people_reviews, journal_entries]
          completion_hint: Alfred looks for early relationship awareness.
      yellow:
        criteria: Understand how your behavior, emotions, communication style, and leadership presence impact other people. Begin developing awareness of trust, empathy, and relational patterns.
        reflection:
          title: Reflection Trial
          prompt: Reflect on your leadership style using a real example. Describe a situation where your behavior positively or negatively impacted another person or team.
          grading_focus: [impact awareness, leadership presence, emotional honesty, ownership]
          completion_hint: Use a concrete example to understand how your style lands on others.
        real_world:
          title: Real-World Trial
          prompt: Ask someone you trust for honest feedback about how you communicate, lead, or show up under stress. Reflect on what surprised you most.
          completion_hint: Invite honest feedback and look for what you did not already know.
        behavioral:
          title: Behavioral Evidence
          prompt: Enter at least 5 team members (direct report, peers or supervisors) into Alfred and be specific about their strength, weakness and aspirations.
          signals: [five_team_members_entered]
          completion_hint: Alfred looks for your leadership context to be mapped through real people.
      green:
        criteria: Apply intentional leadership behaviors and begin aligning communication, delegation, empathy, and support with the kind of leader you want to become.
        reflection:
          title: Reflection Trial
          prompt: Who is the most inspiring leader to you, and what qualities make them inspiring? Reflect on how those qualities compare to your current leadership style.
          grading_focus: [leadership aspiration, self-comparison, values clarity, behavioral intention]
          completion_hint: Use admired leadership qualities to clarify your own growth edge.
        real_world:
          title: Real-World Trial
          prompt: Delegate a meaningful responsibility to someone and intentionally avoid stepping in unless truly necessary. Afterwards, openly discuss the experience with them.
          completion_hint: Practice trust, delegation, and follow-up conversation.
        behavioral:
          title: Behavioral Evidence
          prompt: Complete at least 2 team reviews/check-ins in Alfred.
          signals: [two_team_reviews]
          completion_hint: Alfred counts completed team reviews/check-ins in the background.
      brown:
        criteria: Integrate emotional intelligence, trust, delegation, communication, and leadership presence into a stable and authentic relational operating system.
        reflection:
          title: Reflection Trial
          prompt: What has been your biggest leadership failure, and what did it teach you about yourself?
          grading_focus: [failure ownership, self-knowledge, humility, relational learning]
          completion_hint: Extract leadership wisdom from a real failure.
        real_world:
          title: Real-World Trial
          prompt: Have a difficult but meaningful conversation you have been avoiding. Focus on honesty, empathy, and listening rather than control or defensiveness.
          completion_hint: Practice relational courage without losing empathy.
        behavioral:
          title: Behavioral Evidence
          prompt: Complete 2 journal reflections on how you impact others and complete at least 2 team reviews/check-ins in Alfred, focusing on team members' needs and leadership style.
          signals: [two_impact_journals, two_team_reviews_needs_style]
          completion_hint: Alfred looks for repeated evidence of relational awareness and leadership style calibration.
      black:
        criteria: Develop the ability to elevate, mentor, and inspire others through presence, emotional wisdom, trust, and authentic leadership.
        reflection:
          title: Reflection Trial
          prompt: What kind of leader - and human being - do you hope people become because of your influence?
          grading_focus: [transmission, legacy, emotional wisdom, service]
          completion_hint: Clarify the human impact you want your leadership to leave behind.
        real_world:
          title: Real-World Trial
          prompt: Mentor or coach someone through an important personal or professional challenge while helping them build confidence, clarity, and ownership.
          completion_hint: Help another person grow without taking ownership away from them.
        behavioral:
          title: Behavioral Evidence
          prompt: Complete 2 journal reflections on how you delegate and empower, and complete at least 2 team reviews/check-ins in Alfred focusing on team members' needs and leadership style.
          signals: [two_delegate_empower_journals, two_team_reviews_needs_style]
          completion_hint: Alfred looks for evidence that your leadership elevates others consistently.

  execute:
    name: Prioritize & Execute
    description: Focus, discipline, prioritization, and delivery.
    belts:
      white:
        criteria: Understand how distraction, procrastination, emotional resistance, and lack of prioritization impact your execution and long-term goals. Begin developing awareness of your execution patterns.
        reflection:
          title: Reflection Trial
          prompt: Reflect on a situation where poor prioritization, procrastination, or lack of discipline negatively impacted your performance or well-being. What was truly driving the behavior?
          grading_focus: [execution awareness, procrastination insight, emotional resistance, ownership]
          completion_hint: Identify what was driving the execution pattern beneath the surface behavior.
        real_world:
          active: false
          title: Real-World Trial
          prompt: Track your distractions, avoidance patterns, and reactive behaviors for one full week. Identify the situations, emotions, or triggers most commonly associated with them.
          completion_hint: Observe distraction and avoidance patterns long enough to see the triggers clearly.
        behavioral:
          title: Behavioral Evidence
          prompt: Fill in your prioritization and procrastination tendency, and current executive system.
          signals: [prioritization_tendency_completed, procrastination_tendency_completed, executive_system_completed]
          completion_hint: Alfred looks for your current execution pattern to be explicitly captured.
      yellow:
        criteria: Apply intentional systems for prioritization, focus, planning, and execution. Begin aligning daily behavior with strategic priorities instead of reactive impulses.
        reflection:
          title: Reflection Trial
          prompt: Describe the moments or conditions under which your execution system tends to break down. What patterns, emotions, distractions, or behaviors usually cause you to lose focus, discipline, or momentum?
          grading_focus: [execution ownership, pattern recognition, responsibility, behavioral insight]
          completion_hint: Identify the patterns that interfered with execution.
        real_world:
          title: Real-World Trial
          prompt: Plan your top priorities intentionally for one full week and complete them before engaging in lower-value or reactive work. Reflect on what changed.
          completion_hint: Practice acting from strategic priority before reactive demand.
        behavioral:
          title: Behavioral Evidence
          prompt: Start using Alfred's todolist feature consistently. Aim to log 20 Tasks in the next couple of weeks.
          signals: [tasks_consistently_entered, tasks_maintained]
          completion_hint: Alfred looks for task capture and maintenance becoming consistent.
      green:
        criteria: Integrate discipline, prioritization, focus, and execution into a stable operating system that remains effective under pressure, uncertainty, and competing demands.
        reflection:
          title: Reflection Trial
          prompt: What have you learned about the relationship between discipline, emotion, focus, and performance?
          grading_focus: [integration, discipline, emotional awareness, performance insight]
          completion_hint: Connect execution performance to discipline, emotion, and focus as one system.
        real_world:
          title: Real-World Trial
          prompt: Identify one recurring source of distraction or reactive behavior in your life and redesign your environment, routines, or systems to reduce its influence.
          completion_hint: Make one structural change that reduces recurring distraction.
        behavioral:
          title: Behavioral Evidence
          prompt: Review at least 5 MTN classifications to teach the system how you prioritize.
          signals: [mtn_classifications_reviewed]
          completion_hint: Alfred counts MTN classification reviews in the background.
      brown:
        criteria: Develop the ability to help others improve their execution, prioritization, discipline, and operational effectiveness through systems, coaching, and example.
        reflection:
          title: Reflection Trial
          prompt: What principles now guide the way you prioritize, execute, and manage your attention?
          grading_focus: [principles, attention management, prioritization wisdom, execution clarity]
          completion_hint: Distill the principles that now guide your execution system.
        real_world:
          title: Real-World Trial
          prompt: Help another person improve their workflow, prioritization system, or execution habits. Support them in becoming more intentional and disciplined.
          completion_hint: Translate your execution maturity into help for someone else.
        behavioral:
          title: Behavioral Evidence
          prompt: Update your executive system in light of what you learned.
          signals: [executive_system_updated, execution_lessons_integrated]
          completion_hint: Alfred looks for your execution system evolving from lived learning.
      black:
        criteria: Helps others execute effectively.
        reflection:
          title: Reflection Trial
          prompt: What principles guide your work?
          grading_focus: [principles, clarity, transferability, humility]
          completion_hint: Distill execution wisdom someone else could apply.
        real_world:
          title: Real-World Trial
          prompt: Improve someone else's workflow.
          completion_hint: Help another person create more clarity and leverage.
        behavioral:
          title: Behavioral Evidence
          prompt: Capture coaching activity related to prioritization or execution.
          signals: [execution_coaching, workflow_improvement_notes, delegated_systems]
          completion_hint: Alfred looks for execution maturity being transmitted.

  energy:
    name: Time & Energy
    description: Recovery, capacity, energy management, and sustainability.
    belts:
      white:
        criteria: Understand the relationship between energy, emotions, recovery, stress, and performance. Begin identifying the people, habits, and environments that energize or drain you.
        reflection:
          title: Reflection Trial
          prompt: Reflect on a period where your energy, stress, or lack of recovery negatively impacted your performance, relationships, or well-being. What patterns contributed to it?
          grading_focus: [energy awareness, stress patterns, recovery insight, ownership]
          completion_hint: Connect energy, recovery, stress, and performance through a concrete period in your life.
        real_world:
          active: false
          title: Real-World Trial
          prompt: Track your energy levels, stress levels, and recovery quality for one full week. Identify the situations, people, or habits that most strongly impact your energy.
          completion_hint: Observe the people, habits, and environments that shape your capacity.
        behavioral:
          title: Behavioral Evidence
          prompt: Fill out the sections on energy drains, energy sources, and recovery process.
          signals: [energy_drains_completed, energy_sources_completed, recovery_process_completed]
          completion_hint: Alfred looks for your core energy map to be captured.
      yellow:
        criteria: Apply intentional habits and routines to improve energy, focus, recovery, and sustainability. Begin aligning your lifestyle with long-term performance and well-being.
        reflection:
          title: Reflection Trial
          prompt: How do you intentionally use your energy sources and manage your energy drains throughout the week to sustain performance and well-being?
          grading_focus: [habit awareness, environment awareness, relationship patterns, sustainability]
          completion_hint: Identify which recurring conditions raise or drain your energy.
        real_world:
          title: Real-World Trial
          prompt: Journal on at least 3 seperate occasions about your energy level and what drives it.
          completion_hint: Change one weekly routine and observe its effect on energy and focus.
        behavioral:
          title: Behavioral Evidence
          prompt: In the light of what you learned in the other exercises, define at least 3 habits in the "MyHabits" section that will help you maintain high energy levels. 
          signals: [high_energy_habits_identified, three_energy_level_journals]
          completion_hint: Alfred looks for explicit energy awareness in your habits and journal reflections.
      green:
        criteria: Integrate ambition, discipline, recovery, relationships, and emotional regulation into a sustainable operating system that remains stable under pressure.
        reflection:
          title: Reflection Trial
          prompt: What have you learned about the relationship between ambition, recovery, emotional balance, and sustainable performance?
          grading_focus: [integration, ambition, recovery, emotional balance, sustainability]
          completion_hint: Show how ambition and recovery now work together instead of competing.
        real_world:
          title: Real-World Trial
          prompt: Identify one recurring source of exhaustion, overstimulation, or imbalance in your life and make a meaningful structural change to reduce its impact.
          completion_hint: Make a structural change that reduces a recurring energy drain.
        behavioral:
          title: Behavioral Evidence
          prompt: Maintain a 7-day habit streak.
          signals: [seven_day_habit_streak]
          completion_hint: Alfred looks for sustained habit consistency.
      brown:
        criteria: Develop the ability to model and teach sustainable high performance, emotional balance, and healthy ambition through wisdom, discipline, and example.
        reflection:
          title: Reflection Trial
          prompt: What does sustainable success mean to you now, and how has your understanding evolved over time?
          grading_focus: [sustainable success, wisdom, evolution, healthy ambition]
          completion_hint: Define success in a way that reflects lived learning and can endure.
        real_world:
          title: Real-World Trial
          prompt: Help another person improve their balance, recovery, or sustainability by sharing systems, habits, or perspectives that helped you grow.
          completion_hint: Translate your sustainability lessons into support for another person.
        behavioral:
          title: Behavioral Evidence
          prompt: Maintain a 21-day habit streak and complete 3 journal entries where you call out your energy level and sources explicitly.
          signals: [twenty_one_day_habit_streak, three_energy_level_and_source_journals]
          completion_hint: Alfred looks for longer habit consistency and explicit energy-source reflection.
      black:
        criteria: Models sustainable performance.
        reflection:
          title: Reflection Trial
          prompt: What is sustainable success?
          grading_focus: [wisdom, sustainability, values, transmission]
          completion_hint: Define success in a way that can endure.
        real_world:
          title: Real-World Trial
          prompt: Coach another person on sustainable performance.
          completion_hint: Help someone else protect energy and ambition at once.
        behavioral:
          title: Behavioral Evidence
          prompt: Capture sustainability coaching or mentorship activity.
          signals: [sustainability_coaching, mentorship_notes, recovery_guidance]
          completion_hint: Alfred looks for sustainable leadership being modeled for others.

  learning:
    name: Learning & Development
    description: Growth, resilience, reflection, and continuous improvement.
    belts:
      white:
        criteria: Understand how failures, mistakes, fears, and limitations have shaped your identity, beliefs, and growth patterns. Begin developing a growth-oriented mindset.
        reflection:
          title: Reflection Trial
          prompt: Reflect on one of the most difficult failures, disappointments, or setbacks in your life. What did it teach you about yourself?
          grading_focus: [failure reflection, identity insight, honesty, growth mindset]
          completion_hint: Extract self-knowledge from a difficult setback without collapsing into shame.
        real_world:
          active: false
          title: Real-World Trial
          prompt: Have an honest conversation with someone you trust about a personal weakness, fear, or growth area you typically avoid discussing openly.
          completion_hint: Practice vulnerable learning through a conversation you would normally avoid.
        behavioral:
          title: Behavioral Evidence
          prompt: Complete development opportunities, scars, and failures in Alfred.
          signals: [development_opportunities_completed, scars_completed, failures_completed]
          completion_hint: Alfred looks for your growth landscape to be explicitly captured.
      yellow:
        criteria: Apply intentional learning, reflection, and behavioral change to accelerate personal growth and self-improvement.
        reflection:
          title: Reflection Trial
          prompt: What recurring pattern, fear, or belief has limited your growth the most?
          grading_focus: [limiting belief, pattern recognition, fear awareness, ownership]
          completion_hint: Name the recurring inner pattern that most constrains your growth.
        real_world:
          title: Real-World Trial
          active: false
          prompt: Choose one meaningful growth area and intentionally work on it for two weeks through exercises, habit changes, learning, or behavioral experiments.
          completion_hint: Turn one growth area into a two-week behavioral experiment.
        behavioral:
          title: Behavioral Evidence
          prompt: Complete 3 journal reflections on how scars and past failures impact your behavior.
          signals: [three_behavior_change_journals, self_awareness_reflections, scars_failures_behavior_reflections]
          completion_hint: Alfred looks for repeated reflection on behavior change, self-awareness, scars, and failures.
      green:
        criteria: Integrate learning, resilience, humility, and self-awareness into a continuous process of personal evolution and adaptation.
        reflection:
          title: Reflection Trial
          prompt: What have your failures and scars taught you about resilience, identity, and growth?
          grading_focus: [resilience, identity, growth integration, humility]
          completion_hint: Show how past pain has become useful perspective and capacity.
        real_world:
          title: Real-World Trial
          prompt: Revisit a past failure, relationship, or unresolved experience and intentionally extract a deeper lesson or new perspective from it.
          completion_hint: Return to an old experience and find a more mature lesson inside it.
        behavioral:
          title: Behavioral Evidence
          prompt: Complete 7 journal reflections on behavioral change and self-awareness, including how scars and failures impact your behavior.
          signals: [seven_behavior_change_journals, self_awareness_reflections, scars_failures_behavior_reflections]
          completion_hint: Alfred looks for deeper repeated reflection on behavior change, self-awareness, scars, and failures.
      brown:
        criteria: Develop the ability to help others grow through mentorship, perspective, vulnerability, and wisdom earned through lived experience.
        reflection:
          title: Reflection Trial
          prompt: What lessons from your journey do you most hope others can learn without having to suffer the same mistakes?
          grading_focus: [mentorship, vulnerability, wisdom, transmission]
          completion_hint: Distill the hard-won lessons that could help someone else grow with less suffering.
        real_world:
          title: Real-World Trial
          prompt: Mentor, coach, or support another person through a meaningful growth challenge while helping them build resilience, self-awareness, and confidence.
          completion_hint: Support another person's growth while helping them keep ownership of their path.
        behavioral:
          title: Behavioral Evidence
          prompt: Complete 3 journal reflections on behavioral change among others, including how scars and failures impact your behavior.
          signals: [three_others_behavior_change_journals, scars_failures_behavior_reflections]
          completion_hint: Alfred looks for your growth work becoming useful in how you support others.
      black:
        criteria: Helps others grow.
        reflection:
          title: Reflection Trial
          prompt: What wisdom should endure?
          grading_focus: [wisdom, legacy, humility, transmission]
          completion_hint: Distill what is worth passing on.
        real_world:
          title: Real-World Trial
          prompt: Mentor someone deeply through a growth challenge.
          completion_hint: Support another person's development without owning it for them.
        behavioral:
          title: Behavioral Evidence
          prompt: Capture long-term mentorship patterns.
          signals: [long_term_mentorship, growth_coaching, development_support]
          completion_hint: Alfred looks for your learning becoming service.
