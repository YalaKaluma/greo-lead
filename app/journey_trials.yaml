  energy:
    name: Time & Energy
    description: Recovery, capacity, energy management, and sustainability.
    belts:
      white:
        criteria: Understand that energy is finite and learn to observe the patterns that drain, restore, and sustain it.
        reflection:
          title: The Cost of Running Empty
          prompt: Reflect on a period where low energy, stress, or lack of recovery negatively affected your performance,
            relationships, or well-being. What did it cost you?
          grading_focus:
          - energy awareness
          - stress patterns
          - recovery insight
          - ownership
          completion_hint: Name the cost of running empty and the patterns that contributed to it.
          display_order: 1
        real_world:
          active: true
          title: Energy Audit
          prompt: Journal about your energy, stress, and recovery levels for one week. Notice what drains you, what restores
            you, and when your performance changes.
          completion_hint: Observe your energy patterns long enough to see the triggers clearly.
          display_order: 2
        behavioral:
          title: Map Your Energy Landscape
          prompt: Complete the Energy Sources, Energy Drains, and Recovery sections in Alfred's evidence library.
          signals:
          - energy_drains_completed
          - energy_sources_completed
          - recovery_process_completed
          completion_hint: Alfred looks for your core energy map to be captured.
          display_order: 3
        story:
          title: Life Is a Marathon, Not a Sprint
          theme: Energy Awareness
          image_src: /energy-marathon.png
          image_alt: A runner choosing the marathon path over a sprint at sunrise.
          tagline: Success is not measured by how fast you run, but by how long you can keep running.
          full_story: |-
            At the begining of the leadership journey, one often believes success comes from effort alone.
            Work longer.
            Push harder.
            Take on more.
            For a while it works.
            Then reality catches up.
            Burnout appears.
            Relationships suffer.
            Performance declines.
            The lesson many high performers eventually learn is that life is not a sprint.
            It is a marathon.
            The goal is not to maximize effort today.
            The goal is to sustain performance for years and decades.
            Just as a marathon runner cannot sprint every kilometer, leaders cannot operate at maximum intensity forever.
            The first step toward mastery is recognizing that energy is finite and must be managed intentionally.
          leadership_lesson: |-
            Most people manage time.
            Great leaders learn to manage energy.
            Before you can improve your energy, you must first become aware of it.
          key_message: Energy is the fuel behind every achievement. Learn to notice it before you try to optimize it.
          belt_purpose: Understand that energy is finite and learn to observe it.
          lessons:
          - Most people manage time.
          - Great leaders learn to manage energy.
          - Before you can improve your energy, you must first become aware of it.
          discussion_question: Where are you treating life like a sprint instead of a marathon?
      yellow:
        criteria: Learn how energy can be restored and renewed through deliberate recovery practices.
        reflection:
          title: Recovery Wisdom
          prompt: In your Growth Journal, reflect on what you have learned about the relationship between recovery, energy,
            and performance.
          grading_focus:
          - habit awareness
          - environment awareness
          - relationship patterns
          - sustainability
          completion_hint: Use the Growth Journal to explain how recovery changes the quality and sustainability of your performance.
          display_order: 1
        real_world:
          title: Recovery Experiments
          prompt: Test three recovery practices over two weeks, then share a Growth Journal reflection on which practices
            improved your energy, clarity, or performance the most.
          completion_hint: Treat recovery as an experiment, then use the Growth Journal to compare what actually renews you.
          display_order: 2
        behavioral:
          title: Build Recovery Habits
          prompt: Create at least three habits in Alfred specifically designed to restore or protect your energy, and share
            a Growth Journal reflection on what you notice.
          signals:
          - high_energy_habits_identified
          - three_energy_level_journals
          completion_hint: Alfred looks for explicit recovery habits and energy-related Growth Journal reflection.
          display_order: 3
        story:
          title: Sharpen the Saw
          theme: Recovery
          full_story: |-
            Stephen Covey tells the story of a woodcutter who spends all day cutting trees.
            A passerby notices that the woodcutter is struggling and asks:
            "Why don't you stop for a few minutes and sharpen your saw?"
            The woodcutter replies:
            "I don't have time. I'm too busy cutting."
            Many ambitious people make the same mistake.
            They sacrifice:
            - Sleep
            - Exercise
            - Reflection
            - Recovery
            - Relationships
            because they believe these activities take time away from performance.
            In reality, these activities create performance.
            The sharpest saw cuts the most wood.
            The most recovered leader delivers the best results.
          leadership_lesson: |-
            Recovery is not a distraction from performance.
            Recovery is performance.
          key_message: The secret is not working harder. The secret is renewing your energy before it runs out.
          belt_purpose: Learn how energy can be restored and renewed.
          lessons:
          - Recovery is not a distraction from performance.
          - Recovery is performance.
          - The most recovered leader delivers the best results.
          discussion_question: Where do you need to sharpen the saw before continuing to cut?
      green:
        criteria: Invest energy intentionally and build systems that protect it under pressure.
        reflection:
          title: Energy Allocation
          prompt: How do you intentionally invest your energy across work, relationships, recovery, and high-impact opportunities?
          grading_focus:
          - integration
          - ambition
          - recovery
          - emotional balance
          - sustainability
          completion_hint: Show how you decide what deserves your energy and what does not.
          display_order: 1
        real_world:
          title: Eliminate an Energy Leak
          prompt: Identify one recurring source of exhaustion, overstimulation, or imbalance in your life and make a meaningful
            structural change to reduce its impact.
          completion_hint: Remove or redesign one recurring energy leak.
          display_order: 2
        behavioral:
          title: Energy Operating System
          prompt: Maintain your energy-management habits for 14 consecutive days in Alfred.
          signals:
          - seven_day_habit_streak
          completion_hint: Alfred looks for sustained energy-management habit consistency.
          display_order: 3
        story:
          title: Messi & LeBron
          theme: Strategic Energy
          full_story: |-
            Two of the greatest athletes of all time are:
            - Lionel Messi
            - LeBron James
            Yet both are known for something surprising.
            They often move less than everyone else.
            Messi frequently walks across the field.
            LeBron conserves energy throughout the game.
            To casual observers, it can appear that they are not working hard.
            The reality is the opposite.
            They understand something most people miss:
            Energy is finite.
            Every sprint has a cost.
            Every decision has a cost.
            Every emotional reaction has a cost.
            Rather than spending energy constantly, they deploy it strategically.
            They preserve energy for the moments that matter most.
            When the decisive opportunity appears, they are ready.
          leadership_lesson: |-
            High performers do not spend energy everywhere.
            They invest energy intentionally where it creates the greatest impact.
          key_message: Not everything deserves your energy. Learn to invest it where it matters most.
          belt_purpose: Invest energy intentionally and build systems that protect it.
          lessons:
          - High performers do not spend energy everywhere.
          - Every sprint, decision, and emotional reaction has a cost.
          - Invest energy intentionally where it creates the greatest impact.
          discussion_question: Where are you spending energy that no longer deserves it?
      brown:
        criteria: Become a source of energy for others through presence, recovery wisdom, and emotional steadiness.
        reflection:
          title: The Energy You Create
          prompt: How do people feel after interacting with you? What kind of emotional energy do you create as a leader?
          grading_focus:
          - sustainable success
          - wisdom
          - evolution
          - healthy ambition
          completion_hint: Reflect on whether your leadership leaves people depleted, steady, or more energized.
          display_order: 1
        real_world:
          title: Energize Another Person
          prompt: Help another person improve their energy, resilience, or recovery by sharing support, perspective, or a
            practical system.
          completion_hint: Support someone else in protecting or renewing their energy.
          display_order: 2
        behavioral:
          title: Energy Multiplier
          prompt: Document three occasions where your actions, attitude, or presence helped create energy in another person
            or team.
          signals:
          - twenty_one_day_habit_streak
          - three_energy_level_and_source_journals
          completion_hint: Alfred looks for evidence that your leadership creates energy in others.
          display_order: 3
        story:
          title: Nelson Mandela
          theme: Energy Multiplier
          full_story: |-
            After spending 27 years in prison, Nelson Mandela emerged without bitterness or hatred.
            Many expected revenge.
            Instead, he brought hope.
            Many expected division.
            Instead, he brought unity.
            Mandela understood that leadership is not only about managing your own energy.
            It is about influencing the emotional energy of everyone around you.
            When he entered a room, people felt calmer.
            More optimistic.
            More courageous.
            More capable.
            His presence elevated others.
            This is the highest expression of energy leadership.
          leadership_lesson: |-
            The ultimate goal is not simply to maintain your own energy.
            It is to create energy in others.
          key_message: Great leaders leave people more energized than they found them.
          belt_purpose: Become a source of energy for others.
          lessons:
          - Leadership includes influencing the emotional energy of others.
          - Presence can make people calmer, more optimistic, more courageous, and more capable.
          - Great leaders leave people more energized than they found them.
          discussion_question: How do people feel after interacting with you?
      black:
        criteria: Models sustainable performance.
        reflection:
          title: Reflection Trial
          prompt: What is sustainable success?
          grading_focus:
          - wisdom
          - sustainability
          - values
          - transmission
          completion_hint: Define success in a way that can endure.
          display_order: 1
          active: false
        real_world:
          title: Real-World Trial
          prompt: Coach another person on sustainable performance.
          completion_hint: Help someone else protect energy and ambition at once.
          display_order: 2
          active: false
        behavioral:
          title: Behavioral Evidence
          prompt: Capture sustainability coaching or mentorship activity.
          signals:
          - sustainability_coaching
          - mentorship_notes
          - recovery_guidance
          completion_hint: Alfred looks for sustainable leadership being modeled for others.
          display_order: 3
          active: false
        story:
          title: ''
          theme: ''
          full_story: ''
          lessons: []
          discussion_question: ''
  learning:
    name: Learning & Development
    description: Growth, resilience, reflection, and continuous improvement.
    belts:
      white:
        criteria: Learn from failure by transforming setbacks, disappointments, and scars into self-knowledge.
        reflection:
          title: Failure as Teacher
          prompt: Reflect on one of the most difficult failures, disappointments, or setbacks in your life. What did it teach
            you about yourself?
          grading_focus:
          - failure reflection
          - identity insight
          - honesty
          - growth mindset
          completion_hint: Extract self-knowledge from a difficult setback without hiding from it.
          display_order: 1
        real_world:
          active: true
          title: Expose the Blind Spot
          prompt: Have an honest conversation with someone you trust about a personal weakness, fear, or growth area you typically
            avoid discussing openly. Share here what you learned.
          completion_hint: Practice vulnerable learning through a conversation you would normally avoid.
          display_order: 2
        behavioral:
          title: Capture Your Scars
          prompt: Complete the Development Opportunities, Scars, and Failures sections in Alfred.
          signals:
          - development_opportunities_completed
          - scars_completed
          - failures_completed
          completion_hint: Alfred looks for your growth landscape to be explicitly captured.
          display_order: 3
        story:
          title: Thomas Edison and the 10,000 Attempts
          theme: Learn from Failure
          image_src: /learning-edison.png
          image_alt: Thomas Edison studying a light bulb after many failed experiments.
          tagline: I have not failed. I've just found 10,000 ways that won't work.
          full_story: |-
            Thomas Edison was repeatedly criticized for the thousands of unsuccessful attempts he made while developing the light bulb.

            Many people saw those attempts as failures.

            Edison saw them differently.

            When asked about his repeated failures, he famously responded:

            "I have not failed. I've just found 10,000 ways that won't work."

            Most people interpret failure as evidence that they should stop.

            Edison viewed failure as information.

            Each unsuccessful attempt taught him something.

            Each setback brought him closer to success.

            His breakthrough was not the result of avoiding failure.

            It was the result of learning from it.

            The lesson is timeless.

            Failure is often the tuition we pay for growth.

            The people who grow the most are not the people who fail the least.

            They are the people who learn the most from failure.
          leadership_lesson: |-
            Failures, setbacks, disappointments, and scars are among life's greatest teachers.

            Growth begins when we stop hiding from failure and start learning from it.
          key_message: Every scar contains a lesson.
          belt_purpose: Help users recognize that setbacks are not obstacles to growth. They are the raw material of growth.
          lessons:
          - Failures, setbacks, disappointments, and scars are among life's greatest teachers.
          - Growth begins when we stop hiding from failure and start learning from it.
          - Every scar contains a lesson.
          discussion_question: What lesson is one of your scars still trying to teach you?
      yellow:
        criteria: Recognize the recurring beliefs, fears, assumptions, and behaviors that limit your growth.
        reflection:
          title: The Recurring Pattern
          prompt: In your Growth Journal, reflect on what recurring pattern, fear, belief, or behavior has limited your growth
            the most.
          grading_focus:
          - limiting belief
          - pattern recognition
          - fear awareness
          - ownership
          completion_hint: Use the Growth Journal to name the recurring inner pattern that most constrains your growth.
          display_order: 1
        real_world:
          title: Pattern Hunt
          active: true
          prompt: Over a two-week period, observe your reactions, frustrations, fears, conflicts, and setbacks. Then share
            a Growth Journal reflection identifying at least one recurring pattern that repeatedly influences your behavior.
          completion_hint: Use the Growth Journal to capture the pattern behind your reactions.
          display_order: 2
        behavioral:
          title: Pattern Reflection Journal
          prompt: Complete 3 Growth Journal reflections exploring how past scars, failures, and recurring patterns continue
            to influence your current behavior.
          signals:
          - three_behavior_change_journals
          - self_awareness_reflections
          - scars_failures_behavior_reflections
          completion_hint: Alfred looks for repeated Growth Journal reflection on how past experiences and patterns shape
            current behavior.
          display_order: 3
        story:
          title: Carl Jung and the Shadow
          theme: Recognize Your Patterns
          full_story: |-
            Carl Jung observed that many people experience the same problems over and over throughout their lives.

            Different jobs.

            Different relationships.

            Different environments.

            Yet the same conflicts continue to appear.

            Jung believed these recurring patterns often operate beneath our awareness.

            He called this hidden part of ourselves "the shadow."

            Many people assume life keeps happening to them.

            Jung suggested something different.

            Often, we unconsciously recreate the same situations because we have not yet understood the patterns driving our behavior.

            He famously wrote:

            "Until you make the unconscious conscious, it will direct your life and you will call it fate."

            The challenge is not simply to learn from a single failure.

            The challenge is to recognize the pattern behind the failure.

            Only then can meaningful change begin.
          leadership_lesson: |-
            The obstacle is rarely the event itself.

            The obstacle is the recurring pattern behind the event.
          key_message: What you do not understand will continue to repeat itself.
          belt_purpose: Help users identify the recurring beliefs, fears, assumptions, and behaviors that limit their growth.
          lessons:
          - The obstacle is rarely the event itself.
          - The obstacle is the recurring pattern behind the event.
          - What you do not understand will continue to repeat itself.
          discussion_question: What pattern might be repeating itself in your life right now?
      green:
        criteria: Intentionally transform self-awareness into meaningful behavioral change.
        reflection:
          title: Growth Blueprint
          prompt: Which pattern are you intentionally working to change? What specific behaviors, habits, practices, or routines
            will help you become a better version of yourself?
          grading_focus:
          - resilience
          - identity
          - growth integration
          - humility
          completion_hint: Translate self-awareness into specific behaviors and practices.
          display_order: 1
        real_world:
          title: Deliberate Practice
          prompt: Choose one meaningful growth area and intentionally work on it for two weeks through exercises, habit changes,
            learning activities, coaching, or behavioral experiments.
          completion_hint: Turn one growth area into a deliberate two-week practice.
          display_order: 2
        behavioral:
          title: Growth Journal
          prompt: Complete 7 journal reflections focused on behavioral change, self-awareness, and progress against your growth
            objective.
          signals:
          - seven_behavior_change_journals
          - self_awareness_reflections
          - scars_failures_behavior_reflections
          completion_hint: Alfred looks for deeper repeated reflection on behavior change, self-awareness, and growth progress.
          display_order: 3
        story:
          title: Benjamin Franklin's Virtue System
          theme: Deliberate Growth
          full_story: |-
            As a young man, Benjamin Franklin was ambitious, intelligent, and successful.

            But he was also frustrated.

            He noticed that despite his intelligence, he kept making the same mistakes.

            Sometimes he was impatient.

            Sometimes disorganized.

            Sometimes arrogant.

            Sometimes he failed to live according to the standards he set for himself.

            Franklin realized something important:

            Knowing the right thing to do was not enough.

            He could see his weaknesses.

            But awareness alone was not changing his behavior.

            So he decided to approach personal growth differently.

            Instead of hoping to become better, he created a system.

            He identified the virtues he most wanted to develop:

            Discipline
            Humility
            Temperance
            Patience
            Order

            Every day he tracked his behavior.

            Every week he reviewed his progress.

            Every month he adjusted his focus.

            Over time, growth stopped being an aspiration.

            It became a practice.

            Franklin understood something many people still struggle to accept:

            Self-awareness does not create change.

            Deliberate practice creates change.

            The habits and systems he built helped shape the inventor, diplomat, writer, and statesman we remember today.
          leadership_lesson: |-
            Many people understand their weaknesses.

            Far fewer systematically work to improve them.

            Growth happens when insight is translated into repeated action.
          key_message: The person you become is shaped by what you practice repeatedly.
          belt_purpose: Help users intentionally transform self-awareness into meaningful behavioral change.
          lessons:
          - Many people understand their weaknesses.
          - Far fewer systematically work to improve them.
          - Growth happens when insight is translated into repeated action.
          discussion_question: What weakness are you ready to turn into deliberate practice?
      brown:
        criteria: Help others grow by using questions, coaching, support, and feedback to develop greater self-awareness.
        reflection:
          title: Wisdom Worth Sharing
          prompt: What lessons from your journey do you most hope others can learn without having to suffer the same mistakes?
          grading_focus:
          - mentorship
          - vulnerability
          - wisdom
          - transmission
          completion_hint: Distill the hard-won lessons that could help someone else grow with less suffering.
          display_order: 1
        real_world:
          title: Coaching Through Questions
          prompt: Help another person work through a meaningful challenge. Focus on asking questions that help them identify
            their own patterns, assumptions, blind spots, and opportunities for growth.
          completion_hint: Help another person see their own patterns without taking ownership away from them.
          display_order: 2
        behavioral:
          title: Growth Catalyst Journal
          prompt: Complete 3 journal reflections documenting occasions where your coaching, questions, support, or feedback
            helped another person gain self-awareness, overcome a challenge, or make meaningful progress.
          signals:
          - three_others_behavior_change_journals
          - scars_failures_behavior_reflections
          completion_hint: Alfred looks for evidence that your growth work is helping others develop self-awareness and make
            progress.
          display_order: 3
        story:
          title: Socrates and the Art of Questions
          theme: Help Others Grow
          full_story: |-
            Socrates is considered one of history's greatest teachers.

            Yet he rarely taught by giving answers.

            Instead, he asked questions.

            Powerful questions.

            Questions that challenged assumptions.

            Questions that exposed blind spots.

            Questions that helped people discover truths for themselves.

            Socrates understood something many leaders still struggle to understand today:

            People rarely change because they are told what to do.

            People change when they see something new about themselves.

            His gift was helping others recognize patterns they could not yet see.

            Rather than solving people's problems for them, he helped them think differently.

            His approach became known as the Socratic Method and remains one of the most powerful coaching techniques ever developed.

            The highest expression of learning is not accumulating wisdom for yourself.

            It is helping others discover wisdom for themselves.
          leadership_lesson: |-
            Great leaders do not simply provide answers.

            They help others see what they could not previously see.
          key_message: Great leaders help others recognize the patterns shaping their lives.
          belt_purpose: Help users become catalysts for growth by mentoring, coaching, and helping others develop greater
            self-awareness.
          lessons:
          - Great leaders do not simply provide answers.
          - They help others see what they could not previously see.
          - Great leaders help others recognize the patterns shaping their lives.
          discussion_question: What question could help someone see a pattern they cannot yet see?
      black:
        criteria: Helps others grow.
        reflection:
          title: Reflection Trial
          prompt: What wisdom should endure?
          grading_focus:
          - wisdom
          - legacy
          - humility
          - transmission
          completion_hint: Distill what is worth passing on.
          display_order: 1
          active: false
        real_world:
          title: Real-World Trial
          prompt: Mentor someone deeply through a growth challenge.
          completion_hint: Support another person's development without owning it for them.
          display_order: 2
          active: false
        behavioral:
          title: Behavioral Evidence
          prompt: Capture long-term mentorship patterns.
          signals:
          - long_term_mentorship
          - growth_coaching
          - development_support
          completion_hint: Alfred looks for your learning becoming service.
          display_order: 3
          active: false
        story:
          title: ''
          theme: ''
          full_story: ''
          lessons: []
          discussion_question: ''
