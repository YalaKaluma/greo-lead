values:
  - title: Ownership
    description: Take full responsibility without trying to personally carry every detail.
  - title: Health
    description: Build a body and rhythm that can support ambition over many years.
  - title: Courage
    description: Make visible asks, ship imperfect work, and learn from reality.

visions:
  - title: Build My Own Business
    description: Leave the safety of operator mode and build a durable advisory and software business around executive operating systems.
    why: Alex wants more ownership, creative freedom, and leverage than a traditional executive role provides.
    pillars:
      - title: Offer & Positioning
        description: Define a narrow, valuable offer for growth-stage founders and operators.
        outcomes:
          - title: Define Flagship Offer
            description: Turn broad leadership experience into one clear paid transformation promise.
          - title: Validate ICP
            description: Identify the buyer segment with the strongest urgency and budget.
          - title: Build Case Study Library
            description: Capture proof from past operating wins and advisory conversations.
      - title: Sales & Pipeline
        description: Build a repeatable founder-led sales motion.
        outcomes:
          - title: Book 20 Founder Calls
            description: Run discovery calls with founders, COOs, and investors.
          - title: Close First 3 Clients
            description: Convert early advisory interest into paid design partners.
          - title: Build Referral System
            description: Create a simple follow-up and intro engine.
      - title: Product & Delivery
        description: Turn advisory work into a repeatable operating system.
        outcomes:
          - title: Design Operating System Sprint
            description: Package the first 30-day transformation sprint.
          - title: Create Founder Dashboard Prototype
            description: Build a lightweight software artifact that makes the method visible.
          - title: Document Delivery Playbook
            description: Capture templates, rituals, and coaching prompts.
      - title: Founder Identity
        description: Shift from employee certainty to owner-led action.
        outcomes:
          - title: Protect Founder Deep Work
            description: Block and defend weekly creation time.
          - title: Practice Visible Asks
            description: Ask directly for meetings, referrals, feedback, and sales.
          - title: Build Advisory Board
            description: Surround the business with experienced mentors.
    roadmap:
      - title: Wave 1 - Clarify the Wedge
        description: Narrow the offer, define the buyer, and convert experience into a concrete business thesis.
        goals:
          - Define Flagship Offer
          - Validate ICP
          - Protect Founder Deep Work
        status: completed
      - title: Wave 2 - Prove Demand
        description: Create visible market evidence through calls, referrals, and early paid commitments.
        goals:
          - Book 20 Founder Calls
          - Build Case Study Library
          - Practice Visible Asks
        status: active
      - title: Wave 3 - Deliver Repeatably
        description: Package the work so delivery does not depend on improvisation every time.
        goals:
          - Close First 3 Clients
          - Design Operating System Sprint
          - Document Delivery Playbook
        status: not_started
      - title: Wave 4 - Add Product Leverage
        description: Turn the advisory method into a lightweight product surface and referral loop.
        goals:
          - Create Founder Dashboard Prototype
          - Build Referral System
          - Build Advisory Board
        status: not_started

  - title: Complete a Marathon
    description: Complete a marathon while building consistency, energy, and trust in long-term habit formation.
    why: Alex wants the marathon to become proof that discipline can be steady without becoming harsh.
    pillars:
      - title: Training
        description: Build mileage progressively and avoid the injury-restart loop.
        outcomes:
          - title: Build Weekly Mileage
            description: Reach a sustainable weekly mileage base.
          - title: Complete 18 Mile Long Run
            description: Build confidence in long efforts before race day.
          - title: Finish Marathon
            description: Complete the race feeling proud and healthy.
      - title: Nutrition
        description: Fuel training and reduce chaotic eating patterns.
        outcomes:
          - title: Plan Weekday Meals
            description: Make nutrition easier on busy workdays.
          - title: Practice Race Fueling
            description: Test gels, hydration, and timing during long runs.
          - title: Stabilize Evening Eating
            description: Reduce stress-driven late-night snacking.
      - title: Recovery
        description: Make sleep, mobility, and recovery part of the training plan.
        outcomes:
          - title: Protect Sleep Consistency
            description: Build a more reliable sleep window.
          - title: Add Mobility Routine
            description: Keep hips, calves, and ankles resilient.
          - title: Track Energy Honestly
            description: Notice fatigue early instead of overriding it.
      - title: Identity
        description: Become someone who returns to the plan after disruption.
        outcomes:
          - title: Recover After Missed Runs
            description: Practice recommitting without drama after imperfect weeks.
          - title: Communicate Training Boundaries
            description: Protect training time with work and family.
          - title: Build Morning Routine
            description: Make the first hour of the day less reactive.
    roadmap:
      - title: Wave 1 - Build the Base
        description: Make running and recovery consistent enough to support marathon training.
        goals:
          - Build Weekly Mileage
          - Build Morning Routine
          - Plan Weekday Meals
        status: completed
      - title: Wave 2 - Strengthen the System
        description: Increase long-run confidence while solving nutrition and recovery friction.
        goals:
          - Complete 18 Mile Long Run
          - Practice Race Fueling
          - Protect Sleep Consistency
        status: active
      - title: Wave 3 - Race Specific Prep
        description: Simulate race conditions and reduce avoidable risks.
        goals:
          - Add Mobility Routine
          - Stabilize Evening Eating
          - Communicate Training Boundaries
        status: not_started
      - title: Wave 4 - Race and Integrate
        description: Finish the marathon and turn the identity shift into the next chapter.
        goals:
          - Finish Marathon
          - Recover After Missed Runs
          - Track Energy Honestly
        status: not_started

