leadership_journey:
  current_belt: green
  dimensions:
    - vision
    - people
    - execute
    - energy
    - learning
  evidence:
    strengths:
      - title: Operating clarity
        text: You can turn messy situations into simple operating rhythms, dashboards, and decision rules.
      - title: Pattern recognition
        text: You notice repeated behavioral loops across work, training, and relationships.
      - title: Calm under pressure
        text: You become steadier when the next concrete action is clear.
    failures:
      - title: The delayed business launch
        text: You spent months refining the idea privately instead of testing it with buyers.
        scar: A fear that visible selling would expose the gap between expertise and entrepreneurship.
        learning: The antidote is not more confidence. It is smaller and more frequent market-facing reps.
      - title: Training restart cycle
        text: You repeatedly restarted fitness plans with too much intensity after missed weeks.
        scar: A belief that consistency had to look perfect to count.
        learning: Minimum viable workouts keep identity intact during disrupted weeks.
    development_areas:
      - title: Direct selling
        skill: Making clear offers and asking for commitment without overexplaining.
      - title: Recovery discipline
        skill: Treating sleep and mobility as training, not optional cleanup.
    journey_opportunities:
      - text: Convert founder calls into a sharper paid sprint offer.
        category: business
      - text: Use marathon training as a daily practice of calm repetition.
        category: energy
    energy_sources:
      - title: Founder conversations
        text: Direct conversations with operators facing real execution pain.
        category: creative
      - title: Morning training
        text: Running or lifting before reactive work begins.
        category: physical
      - title: Deep work
        text: Uninterrupted creation time for offers, frameworks, and delivery assets.
        category: mental
    energy_drains:
      - title: Vague optionality
        text: Keeping too many possible businesses alive drains attention and courage.
        category: strategic
        mitigation: Choose one wedge for 30 days before revisiting alternatives.
      - title: Late reactive work
        text: Evening email and operational cleanup weaken sleep and morning training.
        category: recovery
        mitigation: Use a shutdown list and defer non-urgent replies.
    recovery_methods:
      - title: Easy run
        text: Low-intensity running without performance pressure.
        category: exercise
        frequency: weekly
      - title: Sunday planning
        text: Plan training, founder calls, and deep work before the week starts.
        category: planning
        frequency: weekly
      - title: Screen-free shutdown
        text: A short evening routine that lowers activation before sleep.
        category: rest
        frequency: daily
    procrastination_patterns:
      - title: Polishing instead of asking
        text: You improve the offer privately when the next brave action is a buyer conversation.
        trigger: Ambiguous feedback or fear of rejection.
        mitigation: Define the next visible ask before improving the artifact.
      - title: Restarting with intensity
        text: After missed workouts, you want to compensate instead of calmly resuming.
        trigger: Guilt after travel, poor sleep, or work overload.
        mitigation: Use the minimum viable workout within 24 hours.
    execution_systems:
      - title: Weekly MTN review
        text: Choose the three actions that most move the business or marathon goal, then review completed MTN score each Friday.
        category: prioritization
        effectiveness: working well
      - title: Two-track operating week
        text: Each week has one business outcome and one training outcome, with daily minimum reps for both.
        category: execution_system
        effectiveness: improving
    inspiration:
      - title: Make the invisible system visible
        text: You inspire others by turning vague ambition into a clear cadence, dashboard, and next action.
        approach: Practical clarity and honest tradeoffs.
        effectiveness: Strong when you speak from lived experiments.
    coaching_moments:
      - title: Priya delivery playbook review
        text: You asked Priya to critique the sprint playbook instead of asking for generic support.
        person: Priya Shah
        outcome: Priya identified three missing artifacts and took ownership of one.
        learning: Delegation improves when the ask includes decision rights.
      - title: Founder prioritization conversation
        text: You helped Marcus identify the one weekly meeting that could turn priorities into decisions.
        person: Marcus Lee
        outcome: Marcus agreed to test a 30-minute operating cadence.
        learning: The business creates value when advice becomes a repeatable system.
    team_composition:
      - title: Early business support system
        text: Mentor, collaborator, running coach, and peer founder form the support network around your business and marathon goals.
        team_type: advisory
        dynamics: Strong trust, but you need to ask more directly and earlier.
  coaching_sessions:
    - quadrant: vision_goals
      situation: You were trying to keep too many business directions alive while training for a marathon.
      reflection: The lack of focus was protecting you from rejection and commitment.
      pattern: Optionality was being used as emotional safety.
      experiment: Commit to one business wedge and one training block for 30 days.
      development_level: 4
      insights: Focus requires grieving alternate identities.
      practice: Make one market-facing ask and one training action daily.
    - quadrant: time_energy
      situation: Late reactive work was disrupting sleep and morning training.
      reflection: You were treating recovery as optional even though energy was the constraint.
      pattern: Ambition was leaking into unbounded evenings.
      experiment: Use a screen-free shutdown and plan the first task before bed.
      development_level: 3
      insights: Sustainable ambition needs edges.
      practice: Protect the first hour and last hour of the day.

