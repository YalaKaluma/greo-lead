journal:
  - title: Starting again
    body: I am tired of restarting every few months. I know what to do, but consistency breaks when work gets loud.
    depth_score: 2
  - title: Missed run pattern
    body: I miss runs after late work nights, then I treat one missed run like proof that the whole plan failed. That all-or-nothing loop is bigger than running.
    depth_score: 5
  - title: Smaller promises
    body: The breakthrough this week was doing twenty minutes instead of skipping. I am starting to trust the identity of someone who keeps a promise at smaller scale.
    depth_score: 7
  - title: Transformation beyond the race
    body: Marathon training is becoming a mirror. The goal is the finish line, but the deeper change is learning to recover, recommit, and stop making setbacks mean I am back at zero.
    depth_score: 8.7

