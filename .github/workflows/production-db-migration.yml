name: Production DB Migration

on:
  workflow_dispatch:
    inputs:
      confirm_backup:
        description: "Type BACKUP_DONE to confirm the Neon production backup is complete"
        required: true
      target_revision:
        description: "Alembic target revision"
        required: true
        default: "head"

permissions:
  contents: read

concurrency:
  group: production-db-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Run production Alembic migration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PYTHONPATH: ${{ github.workspace }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
      SKIP_DB_INIT: "1"
      SKIP_STARTUP_TASKS: "1"
      OPENAI_API_KEY: ci-placeholder
      DEFAULT_USER_NUMBER: ci-user

    steps:
      - name: Check backup confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_backup }}" != "BACKUP_DONE" ]; then
            echo "Refusing to run production migration without BACKUP_DONE confirmation."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install --require-hashes -r requirements.txt

      - name: Verify production database secret
        run: |
          test -n "$DIRECT_DATABASE_URL"

      - name: Show Alembic state before migration
        run: |
          alembic heads
          alembic current

      - name: Run Alembic upgrade
        run: |
          alembic upgrade "${{ github.event.inputs.target_revision }}"

      - name: Show Alembic state after migration
        run: |
          alembic current
