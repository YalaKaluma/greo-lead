name: Android APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Backend API URL used by the mobile app"
        required: true
        default: "https://greo-lead-development.up.railway.app"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-apk.yml"
      - "app/frontend/**"
      - "static/**"

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ github.event.inputs.api_url || 'https://greo-lead-development.up.railway.app' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build web bundle
        working-directory: app/frontend
        run: pnpm build

      - name: Sync Capacitor Android project
        working-directory: app/frontend
        run: pnpm exec cap sync android

      - name: Add Firebase Android config
        working-directory: app/frontend/android/app
        env:
          GOOGLE_SERVICES_JSON_DEBUG: ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG }}
          GOOGLE_SERVICES_JSON_DEBUG_B64: ${{ secrets.GOOGLE_SERVICES_JSON_DEBUG_B64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          rm -f google-services.json

          if [ -n "$GOOGLE_SERVICES_JSON_DEBUG_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_DEBUG_B64" | base64 --decode > google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON_DEBUG" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_DEBUG" > google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          fi

          if [ -s google-services.json ] && grep -q '"package_name"[[:space:]]*:[[:space:]]*"com.AlfredTheChiefOfStaff.myapp.dev"' google-services.json; then
            echo "Firebase config found for debug package com.AlfredTheChiefOfStaff.myapp.dev."
          elif [ -s google-services.json ]; then
            echo "::warning::Firebase config does not contain debug package com.AlfredTheChiefOfStaff.myapp.dev. Building debug APK without Firebase push config."
            rm -f google-services.json
          else
            echo "::warning::No Firebase config provided for debug APK. Building without Firebase push config."
          fi
        shell: bash

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36"

      - name: Build debug APK
        working-directory: app/frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alfred-debug-apk
          path: app/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
