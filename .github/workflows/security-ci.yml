name: Security CI

on:
  pull_request:
  push:
    branches:
      - main
      - prod

env:
  PYTHONPATH: ${{ github.workspace }}
  DATABASE_URL: sqlite:///./ci.db
  SKIP_DB_INIT: "1"
  SKIP_STARTUP_TASKS: "1"
  OPENAI_API_KEY: ci-placeholder
  DEFAULT_USER_NUMBER: ci-user
  APP_SESSION_SECRET: ci-session-secret-at-least-32-characters-long
  PUBLIC_APP_URL: https://ci.example.com

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-test.txt

      - name: Run backend tests
        run: pytest -q tests

  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Check frontend translations
        working-directory: app/frontend
        run: npm run i18n:check

      - name: Run frontend tests
        working-directory: app/frontend
        run: npm run test

      - name: Build frontend
        working-directory: app/frontend
        run: pnpm build

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-security.txt

      - name: Run Bandit
        run: bandit -r app -x app/frontend

      - name: Run pip-audit
        run: pip-audit -r requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Reject generated or local-environment artifacts
        shell: bash
        run: |
          tracked_artifacts="$(git ls-files | grep -E '(^|/)(\.env($|\.)|venv/|\.venv/|__pycache__/|.*\.pyc$|\.DS_Store$)' || true)"
          if [ -n "$tracked_artifacts" ]; then
            printf 'Generated or local-environment artifacts are tracked:\n%s\n' "$tracked_artifacts"
            exit 1
          fi

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
        with:
          args: detect --source . --redact
