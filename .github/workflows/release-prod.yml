name: Production Release CI

on:
  pull_request:
    branches:
      - prod
  workflow_dispatch:

jobs:
  release-ci:
    name: Release gate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./ci.db
      SKIP_DB_INIT: "1"
      SKIP_STARTUP_TASKS: "1"
      OPENAI_API_KEY: ci-placeholder
      DEFAULT_USER_NUMBER: ci-user
      TWILIO_SID: ci-placeholder
      TWILIO_AUTH_TOKEN: ci-placeholder
      TWILIO_WHATSAPP_NUMBER: ci-placeholder
      MAILGUN_API_KEY: ci-placeholder
      MAILGUN_DOMAIN: ci.example
      MAILGUN_FROM: ci@example.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend tests
        run: pytest -q tests

      - name: Check backend imports
        run: |
          python -c "import app.models; from app.main import app; print(app.title)"

      - name: Validate Alembic configuration
        run: |
          alembic heads
          alembic current

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm install

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build
