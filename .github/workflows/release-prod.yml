name: Production Release CI

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release-ci:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: sqlite:///./ci.db
      SKIP_DB_INIT: "1"
      SKIP_STARTUP_TASKS: "1"
      OPENAI_API_KEY: ci-placeholder
      DEFAULT_USER_NUMBER: ci-user
      APP_SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      PUBLIC_APP_URL: https://ci.example.com

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-test.txt

      - name: Run backend tests
        run: pytest -q tests

      - name: Check backend imports
        run: |
          python -c "import app.models; from app.main import app; print(app.title)"

      - name: Validate Alembic configuration
        run: |
          heads="$(alembic heads)"
          printf '%s\n' "$heads"
          test "$(printf '%s\n' "$heads" | grep -c '(head)')" -eq 1
          alembic current

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Check frontend translations
        working-directory: app/frontend
        run: npm run i18n:check

      - name: Run frontend tests
        working-directory: app/frontend
        run: npm run test

      - name: Build frontend
        working-directory: app/frontend
        run: pnpm build

      - name: Install Playwright browser
        working-directory: app/frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end browser tests
        working-directory: app/frontend
        run: pnpm test:e2e

      - name: Upload end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prod-e2e-diagnostics
          path: |
            app/frontend/playwright-report
            app/frontend/test-results
          retention-days: 14
