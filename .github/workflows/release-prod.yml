name: Production Release CI

on:
  pull_request:
    branches:
      - prod
  workflow_dispatch:

jobs:
  release-ci:
    name: Release gate
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      DATABASE_URL: sqlite:///./ci.db
      SKIP_DB_INIT: "1"
      SKIP_STARTUP_TASKS: "1"
      OPENAI_API_KEY: ci-placeholder
      DEFAULT_USER_NUMBER: ci-user
      APP_SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      PUBLIC_APP_URL: https://ci.example.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend tests
        run: pytest -q tests

      - name: Check backend imports
        run: |
          python -c "import app.models; from app.main import app; print(app.title)"

      - name: Validate Alembic configuration
        run: |
          alembic heads
          alembic current

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm install

      - name: Check frontend translations
        working-directory: app/frontend
        run: npm run i18n:check

      - name: Run frontend tests
        working-directory: app/frontend
        run: npm run test

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build
