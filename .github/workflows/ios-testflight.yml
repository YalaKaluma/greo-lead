name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Backend API URL used by the iOS app
        required: true
        default: https://greo-lead-production.up.railway.app
      version:
        description: App Store version
        required: true
        default: 1.0.0
      upload_to_testflight:
        description: Upload the signed IPA to TestFlight
        required: true
        type: boolean
        default: false

jobs:
  build-ios:
    name: Build iOS release
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VITE_API_URL: ${{ inputs.api_url }}
      IOS_BUNDLE_ID: ai.alfredos.alfred
      IOS_VERSION: ${{ inputs.version }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm install

      - name: Build web bundle
        working-directory: app/frontend
        run: npm run build

      - name: Generate and sync the Capacitor iOS project
        working-directory: app/frontend
        run: |
          node -e "const fs=require('fs'); const path='capacitor.config.json'; const config=JSON.parse(fs.readFileSync(path)); config.appId=process.env.IOS_BUNDLE_ID; fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n')"
          if [ ! -d ios/App ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Configure the iOS application
        working-directory: app/frontend
        run: |
          PLIST_PATH="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Alfred" "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Alfred uses the microphone only when you choose to record a voice entry or meeting." "$PLIST_PATH" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription Alfred uses the microphone only when you choose to record a voice entry or meeting." "$PLIST_PATH"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST_PATH" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST_PATH"

          ICON_SET="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          ICON_FILE=$(node -e "const c=require('./' + process.argv[1]); const image=c.images.find(i => i.filename); if (!image) process.exit(1); process.stdout.write(image.filename)" "$ICON_SET/Contents.json")
          sips -s format jpeg public/alfred-favicon.png --out "$RUNNER_TEMP/alfred-icon.jpg"
          sips -s format png -z 1024 1024 "$RUNNER_TEMP/alfred-icon.jpg" --out "$ICON_SET/$ICON_FILE"

      - name: Verify unsigned iOS simulator build
        if: ${{ !inputs.upload_to_testflight }}
        working-directory: app/frontend/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            TARGETED_DEVICE_FAMILY=1 \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Prepare App Store Connect authentication
        if: inputs.upload_to_testflight
        env:
          APP_STORE_CONNECT_PRIVATE_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_B64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY_B64"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY_B64" | base64 --decode > \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Archive signed iOS app
        if: inputs.upload_to_testflight
        working-directory: app/frontend/ios/App
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          test -n "$APPLE_DEVELOPMENT_TEAM"
          test -n "$APP_STORE_CONNECT_KEY_ID"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Alfred.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_DEVELOPMENT_TEAM" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            MARKETING_VERSION="$IOS_VERSION" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            TARGETED_DEVICE_FAMILY=1 \
            CODE_SIGN_STYLE=Automatic \
            archive

      - name: Create App Store export options
        if: inputs.upload_to_testflight
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          sed "s/APPLE_TEAM_ID/$APPLE_DEVELOPMENT_TEAM/g" \
            app/frontend/scripts/ExportOptions.plist.template > "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export signed IPA
        if: inputs.upload_to_testflight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Alfred.xcarchive" \
            -exportPath "$RUNNER_TEMP/AlfredExport" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to TestFlight
        if: inputs.upload_to_testflight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/AlfredExport" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload iOS archive artifacts
        if: inputs.upload_to_testflight
        uses: actions/upload-artifact@v4
        with:
          name: alfred-ios-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/Alfred.xcarchive
            ${{ runner.temp }}/AlfredExport/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated iOS project for diagnostics
        if: ${{ !inputs.upload_to_testflight }}
        uses: actions/upload-artifact@v4
        with:
          name: alfred-ios-project-${{ github.run_number }}
          path: app/frontend/ios
          if-no-files-found: error
          retention-days: 7
